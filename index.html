        }
        .title-block p {
          margin: 0;
          font-size: 13px;
          color: var(--ink-soft);
        }

        .stamp {
          position: relative;
          width: 92px;
          height: 92px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          transform: rotate(-4deg);
          flex-shrink: 0;
        }
        .stamp-dashed {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px dashed rgba(47,72,88,0.35);
        }
        .stamp-label {
          position: absolute;
          top: 10px;
          left: 0; right: 0;
          text-align: center;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 9px;
          letter-spacing: 2px;
          color: var(--cover);
          font-weight: 600;
        }
        .stamp-date {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 15px;
          font-weight: 600;
          color: var(--cover);
          margin-top: 6px;
        }

        .icon-btn {
          background: var(--paper);
          border: 1px solid rgba(47,72,88,0.15);
          border-radius: 10px;
          padding: 8px 12px;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 13px;
          font-weight: 600;
          color: var(--cover);
          cursor: pointer;
          transition: background 0.15s;
        }
        .icon-btn:hover { background: #fff; }

        .week-nav {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 14px;
        }
        .week-nav-label {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 13px;
          font-weight: 600;
          color: var(--cover);
          min-width: 130px;
          text-align: center;
        }
        .nav-arrow {
          width: 30px; height: 30px;
          border-radius: 8px;
          border: 1px solid rgba(47,72,88,0.2);
          background: var(--paper);
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          color: var(--cover);
        }
        .nav-arrow:hover { background: #fff; }

        .mini-bars {
          display: flex;
          gap: 8px;
          margin-bottom: 20px;
          overflow-x: auto;
        }
        .mini-bar-col {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          min-width: 40px;
        }
        .mini-bar-track {
          width: 10px;
          height: 46px;
          background: rgba(47,72,88,0.1);
          border-radius: 6px;
          display: flex;
          align-items: flex-end;
          overflow: hidden;
        }
        .mini-bar-fill {
          width: 100%;
          background: var(--cover);
          border-radius: 6px;
        }
        .mini-bar-label {
          font-size: 10px;
          font-family: 'IBM Plex Mono', monospace;
          color: var(--ink-soft);
        }
        .mini-bar-today .mini-bar-fill { background: var(--accent); }
        .mini-bar-today .mini-bar-label { color: var(--cover); font-weight: 700; }

        .week-grid {
          display: flex;
          gap: 12px;
          overflow-x: auto;
          scroll-snap-type: x proximity;
          padding-bottom: 12px;
        }
        .day-col {
          flex: 0 0 84%;
          scroll-snap-align: start;
          background: rgba(255,255,255,0.35);
          border-radius: 16px;
          padding: 12px;
          min-height: 200px;
        }
        @media (min-width: 640px) {
          .day-col { flex: 0 0 46%; }
        }
        @media (min-width: 1000px) {
          .week-grid { overflow-x: visible; }
          .day-col { flex: 1 1 0; min-width: 0; }
        }

        .day-col-header {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 10px;
          padding-bottom: 8px;
          border-bottom: 2px solid rgba(47,72,88,0.15);
        }
        .day-col-header.is-today { border-bottom-color: var(--accent); }
        .day-name { font-weight: 700; font-size: 13px; color: var(--cover); }
        .day-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

        .task-card {
          background: var(--paper);
          border-radius: 10px;
          padding: 9px 10px 9px 12px;
          margin-bottom: 8px;
          position: relative;
          border-left: 5px solid transparent;
          cursor: pointer;
          box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .task-card.is-done { opacity: 0.55; }
        .task-top {
          display: flex;
          align-items: flex-start;
          gap: 8px;
        }
        .task-title {
          font-size: 13.5px;
          font-weight: 600;
          line-height: 1.3;
          flex: 1;
        }
        .task-title.is-done { text-decoration: line-through; }
        .check-btn {
          background: none; border: none; padding: 0; margin-top: 1px;
          cursor: pointer; color: var(--cover); flex-shrink: 0;
        }
        .task-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 6px;
        }
        .chip {
          font-size: 10px;
          font-weight: 600;
          padding: 2px 7px;
          border-radius: 20px;
          color: #fff;
          display: inline-flex;
          align-items: center;
          gap: 3px;
        }
        .chip-outline {
          font-size: 10px;
          font-weight: 600;
          padding: 2px 7px;
          border-radius: 20px;
          display: inline-flex;
          align-items: center;
          gap: 3px;
          background: rgba(47,72,88,0.08);
          color: var(--ink-soft);
        }
        .subtask-list {
          margin-top: 7px;
          padding-top: 6px;
          border-top: 1px dashed rgba(47,72,88,0.15);
        }
        .subtask-row {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 11.5px;
          padding: 2px 0;
          color: var(--ink-soft);
        }
        .subtask-row.is-done { text-decoration: line-through; opacity: 0.6; }
        .subtask-row button { background:none; border:none; padding:0; cursor:pointer; color: var(--cover); display:flex; }

        .add-task-btn {
          width: 100%;
          border: 1.5px dashed rgba(47,72,88,0.3);
          background: none;
          border-radius: 10px;
          padding: 8px;
          font-size: 12px;
          font-weight: 600;
          color: var(--ink-soft);
          cursor: pointer;
          display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .add-task-btn:hover { background: rgba(255,255,255,0.5); color: var(--cover); }

        .empty-day {
          font-size: 11.5px;
          color: var(--ink-soft);
          text-align: center;
          padding: 14px 4px;
          font-style: italic;
        }

        /* modal */
        .modal-overlay {
          position: fixed; inset: 0;
          background: rgba(38,51,46,0.45);
          display: flex; align-items: center; justify-content: center;
          padding: 16px;
          z-index: 50;
        }
        .modal-box {
          background: var(--paper);
          border-radius: 18px;
          padding: 22px;
          width: 100%;
          max-width: 440px;
          max-height: 88vh;
          overflow-y: auto;
        }
        .modal-title {
          font-family: 'Fraunces', serif;
          font-size: 20px;
          font-weight: 700;
          color: var(--cover);
          margin: 0 0 16px 0;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .field-label {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.5px;
          text-transform: uppercase;
          color: var(--ink-soft);
          margin: 14px 0 6px 0;
        }
        .text-input {
          width: 100%;
          border: 1.5px solid rgba(47,72,88,0.2);
          border-radius: 8px;
          padding: 9px 10px;
          font-size: 14px;
          font-family: 'Inter', sans-serif;
          background: #fff;
          color: var(--ink);
        }
        .text-input:focus { outline: 2px solid var(--cover); outline-offset: 1px; }

        .row-2 { display: flex; gap: 10px; }
        .row-2 > * { flex: 1; }

        .pill-select { display: flex; gap: 6px; flex-wrap: wrap; }
        .pill {
          padding: 6px 12px;
          border-radius: 20px;
          font-size: 12.5px;
          font-weight: 600;
          cursor: pointer;
          border: 1.5px solid transparent;
          display: flex; align-items: center; gap: 5px;
        }

        .cat-swatch {
          width: 22px; height: 22px; border-radius: 50%;
          cursor: pointer; border: 2px solid transparent;
          flex-shrink: 0;
        }
        .cat-swatch.selected { border-color: var(--ink); }

        .subtask-edit-row {
          display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
        }
        .subtask-edit-row input[type=text] { flex: 1; }
        .subtask-edit-row button { background:none; border:none; cursor:pointer; color: #B23A3A; display:flex; }

        .modal-actions {
          display: flex; justify-content: space-between; align-items: center;
          margin-top: 20px;
        }
        .btn-primary {
          background: var(--cover);
          color: #fff;
          border: none;
          padding: 10px 18px;
          border-radius: 10px;
          font-weight: 700;
          font-size: 13.5px;
          cursor: pointer;
        }
        .btn-primary:hover { background: var(--cover-light); }
        .btn-ghost {
          background: none; border: none;
          color: var(--ink-soft);
          font-size: 13px; font-weight: 600;
          cursor: pointer;
        }
        .btn-delete {
          background: none; border: none;
          color: #B23A3A;
          font-size: 13px; font-weight: 600;
          cursor: pointer;
          display: flex; align-items: center; gap: 5px;
        }

        .tag-popover {
          position: absolute;
          top: 100%; right: 0;
          margin-top: 6px;
          background: var(--paper);
          border-radius: 14px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.15);
          padding: 14px;
          width: 250px;
          z-index: 40;
        }
        .tag-popover-row {
          display: flex; align-items: center; gap: 8px;
          padding: 5px 0;
          font-size: 13px;
        }
        .tag-popover-row .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .tag-popover-row .name { flex: 1; }
        .tag-popover-row button { background: none; border: none; color: #B23A3A; cursor: pointer; display:flex; }

        .save-warning {
          font-size: 11px;
          color: #B23A3A;
          margin-bottom: 10px;
        }

        .header-actions { position: relative; display: flex; gap: 8px; }

        @media print {
          .planner-root {
            background: #fff;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
          }
          .no-print { display: none !important; }
          .stamp { transform: none; }
          .mini-bars { margin-bottom: 14px; }
          .week-grid {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr);
            overflow: visible !important;
            gap: 8px;
          }
          .day-col {
            background: #fff !important;
            border: 1px solid rgba(47,72,88,0.25);
            padding: 8px;
            break-inside: avoid;
          }
          .task-card {
            box-shadow: none;
            break-inside: avoid;
            background: #F7F5EC !important;
          }
          .task-top { align-items: center; }
          .subtask-row button { display: none; }
          .subtask-row { padding-left: 4px; }
          @page {
            size: landscape;
            margin: 12mm;
          }
        }
